
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
  :root {
    --bg:#F5EDE0;--outline:#3A3A3A;--td:#2D2D2D;--tm:#5A5A5A;--tl:#8A8A8A;
    --orange:#F5A623;--orange-dk:#D48B10;--green:#6BBF6B;--card:#FFFFFF;--border:#D4C9B8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans KR',sans-serif;background:#2A2520;display:flex;justify-content:center;padding:16px;}
  .frame{width:380px;background:var(--bg);border-radius:28px;overflow:hidden;position:relative;box-shadow:0 16px 48px rgba(0,0,0,0.45);}
  .world-scene{width:100%;background:linear-gradient(180deg,var(--bg) 0%,#EBE2D2 65%,#DDD3C0 100%);position:relative;display:flex;flex-direction:column;align-items:center;}
  .scene-title{font-size:18px;font-weight:900;color:var(--td);padding:18px 0 6px;letter-spacing:-0.02em;opacity:0;transition:opacity 0.2s;}
  .scene-title.show{opacity:1;}
  .station-area{width:100%;display:flex;justify-content:center;padding:8px 0 10px;cursor:pointer;}
  .slots-row{display:flex;gap:12px;align-items:center;justify-content:center;padding:0 24px 10px;opacity:0;transition:opacity 0.2s;}
  .slots-row.show{opacity:1;}
  .slot{width:82px;height:82px;background:var(--card);border:2px dashed var(--border);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;}
  .slot.filled{border:2px solid var(--outline);background:#FFF8F0;}
  .slot .slot-icon{font-size:30px;margin-bottom:2px;}
  .slot .slot-sub{font-size:10px;font-weight:700;color:var(--tm);}
  .slot-empty-lbl{font-size:10px;color:var(--tl);text-align:center;line-height:1.5;}
  .bottom-bar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 16px 16px;opacity:0;transition:opacity 0.2s;gap:8px;}
  .bottom-bar.show{opacity:1;}
  .circle-btn{width:50px;height:50px;flex-shrink:0;background:var(--card);border:2px solid var(--outline);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 3px 0 var(--border);transition:transform 0.1s;}
  .circle-btn:active{transform:scale(0.93);}
  .circle-btn .cb-icon{font-size:18px;line-height:1;}
  .circle-btn .cb-label{font-size:7.5px;font-weight:700;color:var(--tm);white-space:nowrap;text-align:center;}
  .circle-btn.disabled .cb-icon{opacity:0.4;}
  .circle-btn.disabled .cb-label{color:var(--tl);}
  .feed-hscroll{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;gap:7px;align-items:center;padding:0 2px;user-select:none;cursor:grab;}
  .feed-hscroll.dragging{cursor:grabbing;}
  .feed-hscroll::-webkit-scrollbar{height:0;}
  .feed-cell{width:58px;height:58px;flex-shrink:0;background:var(--card);border:1.5px solid var(--border);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:background 0.1s;}
  .feed-cell:active{background:#F0EBE0;}
  .feed-cell.inactive{opacity:0.5;}
  .feed-cell .fc-icon{font-size:24px;}
  .feed-cell .fc-qty{font-size:9.5px;font-weight:900;color:var(--td);margin-top:1px;}
  .feed-cell .fc-qty.zero{color:var(--tl);}
  .feed-cell .fc-tag{position:absolute;top:-5px;right:-4px;font-size:7.5px;font-weight:700;padding:1px 4px;border-radius:5px;border:1px solid;}
  .fc-tag.shop{background:#FFF3E0;color:#A06000;border-color:var(--orange);}
  .fc-tag.farm{background:#E8F5E0;color:#306010;border-color:var(--green);}
  .toast{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);background:rgba(42,37,32,0.88);color:#fff;border-radius:10px;font-size:12px;font-weight:700;padding:8px 16px;white-space:nowrap;z-index:50;pointer-events:none;opacity:0;transition:opacity 0.25s;}
  .toast.show{opacity:1;}
  .modal-wrap{position:absolute;inset:0;background:rgba(30,25,18,0.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding-bottom:24px;opacity:0;pointer-events:none;transition:opacity 0.2s;}
  .modal-wrap.show{opacity:1;pointer-events:auto;}
  .modal-card{width:330px;background:var(--card);border-radius:20px;border:2px solid var(--outline);padding:22px 20px 18px;animation:sup 0.22s cubic-bezier(0.34,1.4,0.64,1);}
  @keyframes sup{from{transform:translateY(28px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-card .mt{font-size:16px;font-weight:900;color:var(--td);margin-bottom:6px;}
  .modal-card .md{font-size:12.5px;color:var(--tm);line-height:1.6;margin-bottom:16px;}
  .modal-btns{display:flex;gap:9px;}
  .mbtn{flex:1;padding:12px 6px;border-radius:12px;border:2px solid var(--outline);font-family:'Noto Sans KR',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;text-align:center;transition:transform 0.1s;color:#2D2D2D !important;}
  .mbtn:active{transform:scale(0.97);}
  .mbtn-cancel{background:var(--card);box-shadow:0 3px 0 var(--border);}
  .mbtn-cancel:active{box-shadow:0 1px 0 var(--border);}
  .mbtn-confirm{background:var(--orange);box-shadow:0 3px 0 var(--orange-dk);}
  .mbtn-confirm:active{box-shadow:0 1px 0 var(--orange-dk);}
  .mbtn-go{background:var(--green);box-shadow:0 3px 0 #3A9A3A;}
  .mbtn-go:active{box-shadow:0 1px 0 #3A9A3A;}
  .sw{position:absolute;top:10px;left:14px;display:flex;gap:4px;z-index:40;}
  .sw-btn{padding:4px 9px;background:rgba(255,255,255,0.85);border:2px solid var(--outline);border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:10px;font-weight:700;color:#2D2D2D !important;cursor:pointer;}
  .sw-btn.on{background:#2D2D2D;color:#fff !important;}
</style>

<div class="frame">
  <div class="world-scene">
    <div class="scene-title" id="sceneTitle">먹이 주기</div>
    <div class="station-area" id="stationTap" onclick="tapStation()">
      <svg width="220" height="150" viewBox="0 0 220 150" fill="none">
        <ellipse cx="110" cy="128" rx="92" ry="18" fill="#DDD3C0" stroke="#8A8A7A" stroke-width="1" opacity="0.4"/>
        <rect x="20" y="104" width="180" height="15" rx="6" fill="#EDE5D6" stroke="#8A8A7A" stroke-width="1.2"/>
        <ellipse cx="52" cy="112" rx="21" ry="7.5" fill="#D4C9B8" stroke="#3A3A3A" stroke-width="1.2"/>
        <ellipse cx="52" cy="109" rx="15" ry="4.5" fill="#E8DED0"/>
        <circle cx="46" cy="109" r="2.4" fill="#C8A878"/><circle cx="52" cy="108" r="2.4" fill="#C8A878"/><circle cx="58" cy="109" r="2.4" fill="#C8A878"/>
        <ellipse cx="110" cy="112" rx="21" ry="7.5" fill="#D4C9B8" stroke="#3A3A3A" stroke-width="1.2"/>
        <ellipse cx="110" cy="109" rx="15" ry="4.5" fill="#E8DED0"/>
        <circle cx="104" cy="109" r="2.4" fill="#C8A878"/><circle cx="110" cy="108" r="2.4" fill="#C8A878"/><circle cx="116" cy="109" r="2.4" fill="#C8A878"/>
        <ellipse cx="168" cy="112" rx="21" ry="7.5" fill="#D4C9B8" stroke="#3A3A3A" stroke-width="1.2"/>
        <ellipse cx="168" cy="109" rx="15" ry="4.5" fill="#E8DED0"/>
        <circle cx="162" cy="109" r="2.4" fill="#C8A878"/><circle cx="168" cy="108" r="2.4" fill="#C8A878"/><circle cx="174" cy="109" r="2.4" fill="#C8A878"/>
        <rect x="93" y="60" width="34" height="22" rx="5" fill="#F5EDE0" stroke="#3A3A3A" stroke-width="1.3"/>

        </g>
        <g transform="translate(152,70)">
          <ellipse cx="16" cy="18" rx="14" ry="12" fill="#C4B8D4" stroke="#3A3A3A" stroke-width="1.3"/>
          <path d="M5 12l2.5-8h5l1.5 6" fill="#C4B8D4" stroke="#3A3A3A" stroke-width="1" stroke-linejoin="round"/>
          <path d="M22 12l1.5-6h5l2.5 8" fill="#C4B8D4" stroke="#3A3A3A" stroke-width="1" stroke-linejoin="round"/>
          <circle cx="11" cy="17" r="1.5" fill="#3A3A3A"/><circle cx="21" cy="17" r="1.5" fill="#3A3A3A"/>
          <ellipse cx="16" cy="20" rx="2" ry="1" fill="#F0A8A0"/>
        </g>
        <text id="stationHint" x="110" y="143" text-anchor="middle" font-size="9.5" fill="#8A8A7A" font-family="sans-serif">탭하여 먹이 주기</text>
      </svg>
    </div>
    <div class="slots-row" id="slotsRow">
      <div class="slot" id="slot0" onclick="removeSlot(0)"><span class="slot-empty-lbl">empty</span></div>
      <div class="slot" id="slot1" onclick="removeSlot(1)"><span class="slot-empty-lbl">empty</span></div>
      <div class="slot" id="slot2" onclick="removeSlot(2)"><span class="slot-empty-lbl">empty</span></div>
    </div>
    <div class="bottom-bar" id="bottomBar">
      <button class="circle-btn disabled" onclick="tapStorage()">
        <span class="cb-icon">🐱</span>
        <span class="cb-label">길냥이<br>부르기</span>
      </button>
      <div class="feed-hscroll" id="feedList"></div>
      <button class="circle-btn" onclick="tapShop()">
        <span class="cb-icon">🛒</span>
        <span class="cb-label">상점</span>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-wrap" id="modalWrap">
    <div class="modal-card">
      <div class="mt" id="mTitle"></div>
      <div class="md" id="mDesc"></div>
      <div class="modal-btns" id="mBtns"></div>
    </div>
  </div>

  <div class="sw">
    <button class="sw-btn on" id="sw0" onclick="setV(0)">월드</button>
    <button class="sw-btn" id="sw1" onclick="setV(1)">급식소</button>
  </div>
</div>

<script>
const FEEDS=[
  {id:'f1',icon:'🐟',type:'shop',qty:12},
  {id:'f2',icon:'🥫',type:'shop',qty:5},
  {id:'f3',icon:'🐠',type:'farm',qty:8},
  {id:'f4',icon:'🐡',type:'farm',qty:3},
  {id:'f5',icon:'⭐',type:'shop',qty:0},
  {id:'f6',icon:'🍗',type:'shop',qty:0},
  {id:'f7',icon:'🍓',type:'farm',qty:0},
  {id:'f8',icon:'🍎',type:'farm',qty:0},
];
const MAX=100,PER=10;
let slots=[null,null,null],open=false;

function setV(v){
  document.querySelectorAll('.sw-btn').forEach((b,i)=>b.classList.toggle('on',i===v));
  if(v===1)openUI();else closeUI();
}
function tapStation(){if(!open)openUI();}
function openUI(){
  open=true;
  document.getElementById('sceneTitle').classList.add('show');
  document.getElementById('slotsRow').classList.add('show');
  document.getElementById('bottomBar').classList.add('show');
  document.getElementById('stationHint').style.opacity='0';
  document.getElementById('stationTap').style.cursor='default';
  document.querySelectorAll('.sw-btn').forEach((b,i)=>b.classList.toggle('on',i===1));
}
function closeUI(){
  open=false;
  document.getElementById('sceneTitle').classList.remove('show');
  document.getElementById('slotsRow').classList.remove('show');
  document.getElementById('bottomBar').classList.remove('show');
  document.getElementById('stationHint').style.opacity='1';
  document.getElementById('stationTap').style.cursor='pointer';
  document.querySelectorAll('.sw-btn').forEach((b,i)=>b.classList.toggle('on',i===0));
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function tapShop(){showToast('🛒 상점으로 이동하였음 (먹이 카테고리)');}
function tapStorage(){
  showModal('곧 업데이트 됩니다! 🐱','길냥이 부르기 기능은 다음 버전에서 추가될 예정이에요.',
    [{l:'알겠어요!',c:'mbtn-cancel',fn:closeModal}]);
}
function showModal(title,desc,btns){
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mDesc').textContent=desc;
  const c=document.getElementById('mBtns');c.innerHTML='';
  btns.forEach(b=>{const el=document.createElement('button');el.className='mbtn '+b.c;el.textContent=b.l;el.onclick=b.fn;c.appendChild(el);});
  document.getElementById('modalWrap').classList.add('show');
}
function closeModal(){document.getElementById('modalWrap').classList.remove('show');}

function addFeed(id){
  const f=FEEDS.find(x=>x.id===id);
  if(!f||f.qty<=0)return;
  for(let i=0;i<3;i++){
    if(slots[i]&&slots[i].id===id&&slots[i].count<=MAX-PER){
      slots[i].count+=PER;renderSlots();return;
    }
  }
  for(let i=0;i<3;i++){
    if(slots[i]===null){slots[i]={id,icon:f.icon,count:PER};renderSlots();return;}
  }
  showToast('먹이통이 가득 찼어요! 🐾');
}
function removeSlot(i){
  if(!slots[i])return;
  const s=slots[i];
  const ret=Math.floor(s.count/PER);
  const retLabel=ret>0?`먹이통 비우고 ${s.icon} x${ret}개 획득`:`먹이통 비우기 (회수 불가)`;
  showModal('먹이통에서 먹이를 뺄까요?','이미 먹은 먹이는 사라져요!',[
    {l:'닫기',c:'mbtn-cancel',fn:closeModal},
    {l:retLabel,c:'mbtn-confirm',fn:()=>{
      if(ret>0){const f=FEEDS.find(x=>x.id===s.id);if(f){f.qty+=ret;renderFeedList();}}
      slots[i]=null;renderSlots();closeModal();
    }}
  ]);
}
function tapFeed(id){
  const f=FEEDS.find(x=>x.id===id);
  if(!f)return;
  if(f.qty<=0){
    if(f.type==='shop'){
      showModal(`${f.icon} 사료가 없습니다.`,'구매하러 이동하시겠습니까?',[
        {l:'닫기',c:'mbtn-cancel',fn:closeModal},
        {l:'구매하러 이동',c:'mbtn-go',fn:()=>{closeModal();showToast('🛒 상점으로 이동하였음 (먹이 카테고리)');}}
      ]);
    }else{
      showModal(`${f.icon} 먹이가 없습니다.`,'마을을 둘러볼까요?',[
        {l:'닫기',c:'mbtn-cancel',fn:closeModal},
        {l:'둘러보기',c:'mbtn-go',fn:()=>{closeModal();closeUI();showToast(`${f.icon} 수급처로 이동하였음`);}}
      ]);
    }
    return;
  }
  addFeed(id);
}
function renderSlots(){
  for(let i=0;i<3;i++){
    const el=document.getElementById('slot'+i);
    const s=slots[i];
    if(s){
      el.className='slot filled';
      el.innerHTML=`<span class="slot-icon">${s.icon}</span><span class="slot-sub">${s.count}회 남음</span>`;
    }else{
      el.className='slot';
      el.innerHTML='<span class="slot-empty-lbl">empty</span>';
    }
  }
}
function renderFeedList(){
  document.getElementById('feedList').innerHTML=FEEDS.map(f=>{
    const active=f.qty>0;
    const tag=active?'':(f.type==='shop'?`<span class="fc-tag shop">구매</span>`:`<span class="fc-tag farm">파밍</span>`);
    return `<div class="feed-cell${active?'':' inactive'}" onclick="tapFeed('${f.id}')">${tag}<span class="fc-icon">${f.icon}</span><span class="fc-qty${active?'':' zero'}">${active?'x'+f.qty:'없음'}</span></div>`;
  }).join('');
}
setInterval(()=>{
  let ch=false;
  for(let i=0;i<3;i++){if(slots[i]&&slots[i].count>0){slots[i].count--;if(slots[i].count===0)slots[i]=null;ch=true;}}
  if(ch)renderSlots();
},5000);
(function(){
  const el=document.getElementById('feedList');
  let down=false,sx=0,sl=0,moved=false;
  el.addEventListener('mousedown',e=>{down=true;sx=e.pageX-el.offsetLeft;sl=el.scrollLeft;moved=false;el.classList.add('dragging');});
  el.addEventListener('mouseleave',()=>{down=false;el.classList.remove('dragging');});
  el.addEventListener('mouseup',()=>{down=false;el.classList.remove('dragging');});
  el.addEventListener('mousemove',e=>{if(!down)return;e.preventDefault();const w=(e.pageX-el.offsetLeft-sx)*1.2;if(Math.abs(w)>4)moved=true;el.scrollLeft=sl-w;});
  el.addEventListener('touchstart',e=>{sx=e.touches[0].pageX-el.offsetLeft;sl=el.scrollLeft;moved=false;},{passive:true});
  el.addEventListener('touchmove',e=>{const w=(e.touches[0].pageX-el.offsetLeft-sx)*1.2;if(Math.abs(w)>4)moved=true;el.scrollLeft=sl-w;},{passive:true});
  el.addEventListener('click',e=>{if(moved)e.stopPropagation();},{capture:true});
})();
renderFeedList();renderSlots();
</script>
