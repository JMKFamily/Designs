
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.root{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  width:100%;
  padding:1.5rem 1rem;
  background:var(--color-background-tertiary);
}
.phone{
  width:360px;
  height:700px;
  max-height:700px;
  overflow:hidden;
  background:#c8e8b0;
  border-radius:28px;
  border:0.5px solid #b0a898;
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 8px 32px rgba(0,0,0,.18);
  flex-shrink:0;
}
.hud{position:absolute;top:0;left:0;right:0;z-index:10;padding:10px 14px 8px;display:flex;justify-content:space-between;align-items:center;}
.hud-title{font-size:13px;font-weight:600;color:#2e2418;background:rgba(255,255,255,.82);border-radius:10px;padding:3px 10px;}
.hud-res{display:flex;gap:6px;}
.res-pill{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.82);border-radius:20px;padding:3px 9px;font-size:12px;}
.gd{width:8px;height:8px;border-radius:50%;background:#7090ff;display:inline-block;flex-shrink:0;}
.pd{width:8px;height:8px;border-radius:50%;background:#c0a060;display:inline-block;flex-shrink:0;}

.sel-banner{position:absolute;top:42px;left:0;right:0;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:4px 12px;}
.sel-pill{background:rgba(255,255,255,.88);border-radius:10px;padding:3px 10px;font-size:11px;font-weight:500;color:#2e2418;}
.sel-uses{background:rgba(255,255,255,.88);border-radius:10px;padding:3px 10px;font-size:11px;color:#2e2418;}

.world{flex:1 1 0;min-height:0;overflow:hidden;position:relative;}
.world-bg{position:absolute;inset:0;background:linear-gradient(150deg,#b8e090 0%,#a0d070 60%,#90c060 100%);}
.world-bg::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(60,140,20,.12) 1px,transparent 1px);background-size:18px 18px;}

.tile{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.tile:hover .tile-body{filter:brightness(1.08);}
.tile-body{border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.22);}
.tile-label{font-size:9px;color:#2e2418;background:rgba(255,255,255,.75);border-radius:8px;padding:1px 5px;margin-top:3px;white-space:nowrap;}
.tile.sel .tile-body{box-shadow:0 0 0 3px #2196f3,0 3px 8px rgba(0,0,0,.22);}
.badge-bubble{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#e03030;color:#fff;font-size:8px;border-radius:6px;padding:1px 5px;white-space:nowrap;z-index:2;}
.badge-bubble::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);border:3px solid transparent;border-top-color:#e03030;}
.badge-repair{background:#e8a020;}
.badge-repair::after{border-top-color:#e8a020;}
.tile-body.broken{filter:grayscale(.55);}
.tile-body.repairing{filter:grayscale(.5);}
.tile-label.broken,.tile-label.repairing{color:#888;}

.panel{background:#fff8ee;border-top:0.5px solid #c8bca8;flex:0 0 auto;}
.panel-empty{padding:14px;text-align:center;font-size:11px;color:#a09080;}
.pinner{padding:10px 12px 8px;display:flex;flex-direction:column;gap:7px;}

.lv-row{display:flex;align-items:center;gap:7px;}
.lv-tag{font-size:10px;font-weight:600;color:#fff;background:#2a9c4a;border-radius:6px;padding:1px 7px;white-space:nowrap;}
.lv-track{flex:1;height:6px;background:#e0d8c8;border-radius:3px;overflow:hidden;}
.lv-fill{height:100%;background:#2a9c4a;border-radius:3px;}
.lv-max{font-size:9px;color:#a09080;}

.stats-row{display:flex;gap:5px;}
.sbox{flex:1;background:#f5f0e4;border-radius:7px;padding:5px 5px 4px;display:flex;flex-direction:column;gap:2px;}
.sbox-top{display:flex;align-items:center;gap:3px;}
.sbox-icon{font-size:13px;}
.sbox-label{font-size:8px;color:#8a7e6a;}
.sbox-val{font-size:15px;font-weight:600;color:#2e2418;line-height:1.1;}
.dp{font-size:11px;font-weight:500;color:#1a6c2a;}
.dm{font-size:11px;font-weight:500;color:#8c1a1a;}
.ptrack{height:3px;background:#e0d8c8;border-radius:2px;overflow:hidden;}
.pfill-u{height:100%;background:#2196f3;border-radius:2px;}
.pfill-r{height:100%;background:#e8a020;border-radius:2px;}
.pfill-h{height:100%;background:#e84090;border-radius:2px;}

.repair-choice{display:flex;gap:6px;}
.btn-repair{flex:1;background:#2a9c4a;color:#fff;border:none;border-radius:7px;padding:7px 0;font-size:11px;font-weight:600;cursor:pointer;}
.btn-demo-s{flex:1;background:#f0ebe0;color:#5a4020;border:0.5px solid #c8bca8;border-radius:7px;padding:7px 0;font-size:11px;cursor:pointer;}

.repair-bar{background:#fff3cd;border-radius:7px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;}
.repair-time-label{font-size:9px;color:#7a5000;margin-bottom:1px;}
.repair-timer{font-size:15px;font-weight:600;color:#7a5000;}
.btn-skip{background:#e8a020;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:3px;}

.btn-upg{width:100%;background:#2a9c4a;color:#fff;border:none;border-radius:7px;padding:8px 0;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
.upg-row{display:flex;gap:6px;}
.btn-cancel-s{background:#cc2222;color:#fff;border:none;border-radius:7px;padding:7px 14px;font-size:11px;font-weight:600;cursor:pointer;}
.btn-confirm-s{flex:1;background:#1a6c2a;color:#fff;border:none;border-radius:7px;padding:7px 0;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;}

.mgmt-board{background:#f5f0e4;border-radius:7px;padding:7px 8px;}
.mgmt-row{display:flex;}
.mgmt-col{flex:1;}
.mgmt-col-title{font-size:9px;font-weight:600;color:#7a6e5a;margin-bottom:4px;padding-bottom:2px;border-bottom:0.5px solid #e0d8c8;}
.mgmt-item{display:flex;justify-content:space-between;padding:2px 0;font-size:10px;}
.mgmt-item-name{color:#5a4830;}
.mgmt-item-val{font-weight:500;}
.mgmt-item-red{color:#e03030;}
.mgmt-item-org{color:#c07010;}
.mgmt-divider{width:0.5px;background:#e0d8c8;margin:0 8px;}
.btn-catalog{width:100%;background:#2196f3;color:#fff;border:none;border-radius:7px;padding:7px 0;font-size:11px;font-weight:600;cursor:pointer;}

.bottom-row{display:flex;justify-content:space-between;align-items:center;padding-top:2px;}
.btn-x{width:34px;height:34px;border-radius:50%;border:0.5px solid #c8bca8;background:#f0ebe0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:#5a5048;}
.btn-trash{width:30px;height:30px;border-radius:7px;border:0.5px solid #c8bca8;background:#f0ebe0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;}
.btn-trash:hover{background:#fde8e8;}

.demo-overlay{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;border-radius:28px;z-index:30;}
.demo-sheet{background:#1c1810;width:100%;border-radius:16px 16px 0 0;padding:18px 16px 22px;color:#f0ebe0;}
.demo-sheet-title{font-size:14px;font-weight:600;margin-bottom:12px;}
.demo-arrow-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.demo-bldg{font-size:12px;color:#d0c8b8;}
.demo-arrow{font-size:18px;color:#808080;}
.demo-reward{display:flex;align-items:center;gap:5px;font-size:16px;font-weight:700;}
.demo-note{font-size:11px;color:#a09080;margin-bottom:16px;line-height:1.5;}
.demo-btn-row{display:flex;gap:8px;}
.btn-demo-cancel{flex:1;background:#3a3028;color:#f0ebe0;border:none;border-radius:8px;padding:11px 0;font-size:13px;cursor:pointer;}
.btn-demo-go{flex:1;background:#f0c040;color:#1c1810;border:none;border-radius:8px;padding:11px 0;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}

.toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(28,18,8,.9);color:#f0ebe0;padding:7px 16px;border-radius:20px;font-size:11px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;z-index:50;}
.toast.show{opacity:1;}
</style>

<div class="root">
<div class="phone" id="app">
  <div class="hud">
    <div class="hud-title">관리 모드</div>
    <div class="hud-res">
      <div class="res-pill"><div class="gd"></div><span id="gems-d">88</span></div>
      <div class="res-pill"><div class="pd"></div><span id="parts-d">24</span></div>
    </div>
  </div>
  <div class="sel-banner">
    <div class="sel-pill" id="sel-pill">관리할 건물을 선택하세요.</div>
    <div class="sel-uses" id="sel-uses" style="display:none;"></div>
  </div>
  <div class="world" id="world">
    <div class="world-bg"></div>
    <div class="tile" id="t0" style="left:50px;top:70px;" onclick="selectTile(0,event)">
      <div class="tile-body" style="width:72px;height:72px;background:#e8d8b0;border:2px solid #c4a870;">🗼</div>
      <div class="tile-label">캣타워</div>
    </div>
    <div class="tile" id="t1" style="left:230px;top:55px;" onclick="selectTile(1,event)">
      <div class="badge-bubble">수리 필요</div>
      <div class="tile-body broken" style="width:66px;height:66px;background:#d0c8b8;border:2px solid #a09080;">🍚</div>
      <div class="tile-label broken">급식소</div>
    </div>
    <div class="tile" id="t2" style="left:245px;top:185px;" onclick="selectTile(2,event)">
      <div class="badge-bubble badge-repair">수리중</div>
      <div class="tile-body repairing" style="width:62px;height:62px;background:#d0c8b8;border:2px solid #a09080;">🌱</div>
      <div class="tile-label repairing">텃밭</div>
    </div>
    <div class="tile" id="t3" style="left:130px;top:195px;" onclick="selectTile(3,event)">
      <div class="tile-body" style="width:66px;height:66px;background:#c8d8f0;border:2px solid #8090c0;">🏢</div>
      <div class="tile-label">관리사무소</div>
    </div>
  </div>
  <div class="panel" id="panel">
    <div class="panel-empty">건물을 선택하면 정보가 표시됩니다.</div>
  </div>
  <div class="demo-overlay" id="demo-ov" style="display:none;">
    <div class="demo-sheet">
      <div class="demo-sheet-title">철거하기</div>
      <div class="demo-arrow-row">
        <div class="demo-bldg" id="dov-bldg"></div>
        <div class="demo-arrow">➜</div>
        <div class="demo-reward"><div class="pd" style="width:12px;height:12px;"></div><span id="dov-mat"></span></div>
      </div>
      <div class="demo-note" id="dov-note"></div>
      <div class="demo-btn-row">
        <button class="btn-demo-cancel" onclick="closeDemoOv()">취소</button>
        <button class="btn-demo-go" onclick="doDemo()"><div class="pd" style="width:10px;height:10px;"></div><span id="dov-mat2"></span></button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast-el"></div>
</div>
</div>

<script>
let gems=88,parts=24;
const TILES=[
  {id:0,name:'캣타워',icon:'🗼',type:'finite',status:'active',level:3,maxLevel:20,uses:23,maxUses:50,repairMin:30,happy:5,repairCostBase:10},
  {id:1,name:'급식소',icon:'🍚',type:'finite',status:'broken',level:2,maxLevel:20,uses:0,maxUses:40,repairMin:40,happy:4,repairCostBase:8},
  {id:2,name:'텃밭',icon:'🌱',type:'finite',status:'repairing',level:5,maxLevel:20,uses:0,maxUses:60,repairMin:25,happy:6,timerSec:2033,repairCostBase:12},
  {id:3,name:'관리사무소',icon:'🏢',type:'infinite',status:'active',level:1,maxLevel:1,uses:Infinity,maxUses:Infinity,repairMin:null,happy:null,repairCostBase:0},
];
let selId=null,upgPreview=false,repairTicks={};

function startTick(id){
  if(repairTicks[id])return;
  repairTicks[id]=setInterval(()=>{
    const t=TILES[id];
    if(!t||t.status!=='repairing'){clearInterval(repairTicks[id]);return;}
    t.timerSec=Math.max(0,t.timerSec-1);
    if(t.timerSec===0){
      clearInterval(repairTicks[id]);delete repairTicks[id];
      t.status='active';t.uses=t.maxUses;
      const b=document.getElementById('t'+id).querySelector('.badge-bubble');if(b)b.remove();
      document.getElementById('t'+id).querySelector('.tile-body').className='tile-body';
      document.getElementById('t'+id).querySelector('.tile-label').className='tile-label';
      showToast(t.name+' 수리 완료!');
    }
    if(selId===id)renderPanel();
  },1000);
}
startTick(2);

function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function matCalc(t){return Math.max(1,Math.round(50*t.level*0.1*t.level));}

function selectTile(id,e){
  if(e)e.stopPropagation();
  upgPreview=false;selId=id;
  document.querySelectorAll('.tile').forEach((el,i)=>el.classList.toggle('sel',i===id));
  const t=TILES[id];
  document.getElementById('sel-pill').textContent=t.name;
  const u=document.getElementById('sel-uses');u.style.display='';
  u.innerHTML=t.type==='infinite'
    ?'이용 횟수 <b style="color:#2196f3;">∞</b>'
    :'남은 이용 횟수 <b style="color:#e03030;">'+t.uses+'/'+t.maxUses+'</b>';
  renderPanel();
}
document.getElementById('world').addEventListener('click',e=>{
  if(e.target.id==='world'||e.target.classList.contains('world-bg'))deselect();
});
function deselect(){
  selId=null;upgPreview=false;
  document.querySelectorAll('.tile').forEach(el=>el.classList.remove('sel'));
  document.getElementById('sel-pill').textContent='관리할 건물을 선택하세요.';
  document.getElementById('sel-uses').style.display='none';
  renderPanel();
}
function renderPanel(){
  const p=document.getElementById('panel');
  if(selId===null){p.innerHTML='<div class="panel-empty">건물을 선택하면 정보가 표시됩니다.</div>';return;}
  const t=TILES[selId];
  if(t.type==='infinite'){renderMgmtPanel(p);return;}
  const lvPct=Math.round((t.level/t.maxLevel)*100);
  const repPct=t.repairMin!=null?Math.round(((50-t.repairMin)/30)*100):0;
  const hapPct=t.happy!=null?Math.round(((t.happy-4)/3)*100):0;
  const upCost=(t.level+1)*10;
  const usesVal=upgPreview?`<div class="sbox-val">${t.maxUses}<span class="dp">+5</span></div>`:`<div class="sbox-val">${t.maxUses}</div>`;
  const repVal=upgPreview?`<div class="sbox-val">${t.repairMin}<span class="dm">-2</span></div>`:`<div class="sbox-val">${t.repairMin}</div>`;
  const hapVal=upgPreview?`<div class="sbox-val">${t.happy}<span class="dp">+1</span></div>`:`<div class="sbox-val">${t.happy}</div>`;
  const stats=`<div class="stats-row">
    <div class="sbox"><div class="sbox-top"><span class="sbox-icon">🔧</span><span class="sbox-label">이용 횟수 (회)</span></div>${usesVal}<div class="ptrack"><div class="pfill-u" style="width:${Math.round(t.maxUses)}%"></div></div></div>
    ${t.repairMin!=null?`<div class="sbox"><div class="sbox-top"><span class="sbox-icon">⏱</span><span class="sbox-label">수리 시간 (분)</span></div>${repVal}<div class="ptrack"><div class="pfill-r" style="width:${repPct}%"></div></div></div>`:''}
    ${t.happy!=null?`<div class="sbox"><div class="sbox-top"><span class="sbox-icon">❤️</span><span class="sbox-label">행복도 (%)</span></div>${hapVal}<div class="ptrack"><div class="pfill-h" style="width:${hapPct}%"></div></div></div>`:''}
  </div>`;
  let action='',br='';
  if(t.status==='broken'){
    action=`<div class="repair-choice"><button class="btn-repair" onclick="doStartRepair(${selId})">🔧 수리하기</button><button class="btn-demo-s" onclick="openDemoOv(${selId})">철거</button></div>`;
    br=`<div class="btn-trash" onclick="openDemoOv(${selId})">🗑</div>`;
  } else if(t.status==='repairing'){
    const sc=Math.max(1,Math.ceil((t.timerSec/60+1)*2));
    action=`<div class="repair-bar"><div><div class="repair-time-label">수리 완료까지 남은 시간</div><div class="repair-timer">${fmt(t.timerSec)}</div></div><button class="btn-skip" onclick="skipRepair(${selId},${sc})"><div class="gd"></div>${sc} 즉시완료</button></div>`;
    br=`<div style="width:30px;"></div>`;
  } else {
    action=upgPreview
      ?`<div class="upg-row"><button class="btn-cancel-s" onclick="upgPreview=false;renderPanel()">그만두기</button><button class="btn-confirm-s" onclick="doUpgrade(${selId})"><div class="gd"></div>확인 ${upCost}</button></div>`
      :`<button class="btn-upg" onclick="upgPreview=true;renderPanel()"><div class="gd"></div>${upCost} 업그레이드</button>`;
    br=`<div class="btn-trash" onclick="openDemoOv(${selId})">🗑</div>`;
  }
  p.innerHTML=`<div class="pinner">
    <div class="lv-row"><div class="lv-tag">Level ${t.level}</div><div class="lv-track"><div class="lv-fill" style="width:${lvPct}%"></div></div><div class="lv-max">/ ${t.maxLevel}</div></div>
    ${stats}${action}
    <div class="bottom-row"><div class="btn-x" onclick="deselect()">✕</div><div style="font-size:10px;color:#a09080;">${t.name} Lv.${t.level}</div>${br}</div>
  </div>`;
}
function renderMgmtPanel(p){
  const active=TILES.filter(t=>t.type==='finite'&&t.status==='active');
  const repairing=TILES.filter(t=>t.status==='repairing');
  const broken=TILES.filter(t=>t.status==='broken');
  const aR=active.map(t=>`<div class="mgmt-item"><span class="mgmt-item-name">${t.name}</span><span class="mgmt-item-val">${t.uses}/${t.maxUses}</span></div>`).join('');
  const bR=broken.map(t=>`<div class="mgmt-item"><span class="mgmt-item-name">${t.name}</span><span class="mgmt-item-val mgmt-item-red">수리 필요</span></div>`).join('');
  const rR=repairing.map(t=>`<div class="mgmt-item"><span class="mgmt-item-name">${t.name}</span><span class="mgmt-item-val mgmt-item-org">${fmt(t.timerSec||0)}</span></div>`).join('');
  p.innerHTML=`<div class="pinner">
    <div class="mgmt-board"><div class="mgmt-row">
      <div class="mgmt-col"><div class="mgmt-col-title">운영중</div>${aR||'<div style="font-size:10px;color:#a09080;padding:2px 0;">없음</div>'}${bR?`<div class="mgmt-col-title" style="margin-top:5px;">파손</div>${bR}`:''}</div>
      <div class="mgmt-divider"></div>
      <div class="mgmt-col"><div class="mgmt-col-title">수리중</div>${rR||'<div style="font-size:10px;color:#a09080;padding:2px 0;">없음</div>'}</div>
    </div></div>
    <button class="btn-catalog" onclick="showToast('건물 도감은 추후 구현 예정입니다.')">건물 도감 보기</button>
    <div class="bottom-row"><div class="btn-x" onclick="deselect()">✕</div><div style="font-size:10px;color:#a09080;">관리사무소</div><div style="width:30px;"></div></div>
  </div>`;
}
function doStartRepair(id){
  const t=TILES[id];t.status='repairing';t.timerSec=1800;
  const el=document.getElementById('t'+id);
  let b=el.querySelector('.badge-bubble');
  if(!b){b=document.createElement('div');el.insertBefore(b,el.firstChild);}
  b.className='badge-bubble badge-repair';b.textContent='수리중';
  el.querySelector('.tile-body').className='tile-body repairing';
  el.querySelector('.tile-label').className='tile-label repairing';
  startTick(id);upgPreview=false;renderPanel();showToast(t.name+' 수리를 시작합니다!');
}
function skipRepair(id,cost){
  if(gems<cost){showToast('보석이 부족합니다.');return;}
  gems-=cost;document.getElementById('gems-d').textContent=gems;
  clearInterval(repairTicks[id]);delete repairTicks[id];
  const t=TILES[id];t.status='active';t.uses=t.maxUses;t.timerSec=0;
  const el=document.getElementById('t'+id);
  const b=el.querySelector('.badge-bubble');if(b)b.remove();
  el.querySelector('.tile-body').className='tile-body';
  el.querySelector('.tile-label').className='tile-label';
  document.getElementById('sel-uses').innerHTML='남은 이용 횟수 <b style="color:#e03030;">'+t.uses+'/'+t.maxUses+'</b>';
  upgPreview=false;renderPanel();showToast('즉시 수리 완료!');
}
function doUpgrade(id){
  const t=TILES[id];const cost=(t.level+1)*10;
  if(gems<cost){showToast('보석이 부족합니다.');return;}
  gems-=cost;document.getElementById('gems-d').textContent=gems;
  t.level++;t.maxUses=Math.min(t.maxUses+5,100);
  if(t.repairMin!=null)t.repairMin=Math.max(t.repairMin-2,20);
  if(t.happy!=null)t.happy=Math.min(t.happy+1,7);
  upgPreview=false;
  document.getElementById('sel-uses').innerHTML='남은 이용 횟수 <b style="color:#e03030;">'+t.uses+'/'+t.maxUses+'</b>';
  renderPanel();showToast('Lv.'+t.level+' 업그레이드 완료!');
}
function openDemoOv(id){
  const t=TILES[id];const mat=matCalc(t);
  document.getElementById('dov-bldg').textContent=t.name+' Lv.'+t.level;
  document.getElementById('dov-mat').textContent=mat;
  document.getElementById('dov-mat2').textContent=mat;
  document.getElementById('dov-note').textContent='Lv.'+t.level+' '+t.name+' 철거 시 부품 '+mat+'개를 획득할 수 있어요!';
  document.getElementById('demo-ov').style.display='flex';
}
function closeDemoOv(){document.getElementById('demo-ov').style.display='none';}
function doDemo(){
  const t=TILES[selId];const mat=matCalc(t);
  parts+=mat;document.getElementById('parts-d').textContent=parts;
  document.getElementById('t'+selId).style.display='none';
  TILES[selId].status='demolished';
  closeDemoOv();deselect();showToast('철거 완료! 부품 '+mat+'개 획득.');
}
let toastTm;
function showToast(m){
  const el=document.getElementById('toast-el');
  el.textContent=m;el.classList.add('show');
  clearTimeout(toastTm);toastTm=setTimeout(()=>el.classList.remove('show'),2500);
}
</script>
