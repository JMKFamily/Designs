<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고양이 주민 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#2e2420;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.frame{width:340px;background:#f0ece3;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.gem-bar{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.gem-bar b{font-size:13px;font-weight:600;color:#3a3028}
.gem-bar small{font-size:11px;color:#8a7e72}
.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.card-row{display:flex;gap:10px}
.portrait{width:76px;height:76px;border-radius:10px;background:#f0ece3;display:flex;align-items:center;justify-content:center;font-size:38px;flex-shrink:0;position:relative;border:1px solid rgba(0,0,0,0.07)}
.costume-tag{position:absolute;bottom:-4px;right:-4px;font-size:14px}
.nav-btns{display:flex;gap:5px;margin-top:7px;justify-content:center}
.icon-btn{width:28px;height:28px;border:1px solid rgba(0,0,0,0.15);border-radius:6px;background:#f8f6f2;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.icon-btn:hover{background:#ede9e0}
.info{flex:1;min-width:0}
.name-row{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.cat-name{font-size:15px;font-weight:600;color:#3a3028;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.happy-row{display:flex;align-items:center;gap:5px;margin-bottom:8px}
.happy-row span{font-size:13px;font-weight:500;color:#3a3028}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px}
.stat-box{background:#f8f6f2;border-radius:8px;padding:5px 8px}
.stat-box .lbl{font-size:9px;color:#9a8e82;margin-bottom:1px}
.stat-box .val{font-size:13px;font-weight:600;color:#3a3028}
.action-row{display:flex;gap:5px}
.abtn{flex:1;padding:6px 3px;font-size:10px;border:1px solid rgba(0,0,0,0.12);border-radius:8px;background:#f8f6f2;cursor:pointer;color:#6a5e52;display:flex;align-items:center;justify-content:center;gap:2px;text-align:center;line-height:1.3}
.abtn:hover{background:#ede9e0}
.abtn.red{border-color:#E24B4A;color:#A32D2D;background:#fff5f5}
.abtn.red:hover{background:#FCEBEB}
.badge{display:inline-flex;align-items:center;gap:2px;font-size:9px;padding:2px 6px;border-radius:8px}
.badge.ok{background:#EAF3DE;color:#3B6D11}
.list-wrap{background:#fff;border-radius:14px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.list-lbl{font-size:10px;color:#9a8e82;margin-bottom:7px}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{aspect-ratio:1;border:1px solid rgba(0,0,0,0.08);border-radius:8px;background:#f8f6f2;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;position:relative;transition:border-color 0.15s}
.cell:hover{border-color:rgba(0,0,0,0.25)}
.cell.active{border:2px solid #c8a87a}
.cell .badge-dot{position:absolute;top:1px;right:1px;font-size:9px;line-height:1}
.cell .cos{position:absolute;bottom:1px;right:1px;font-size:8px;line-height:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3a3028;color:#f0ece3;padding:7px 16px;border-radius:16px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity 0.25s;pointer-events:none;z-index:100}
.toast.on{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:14px;padding:20px;width:240px}
.modal h3{font-size:14px;font-weight:600;margin-bottom:10px;color:#3a3028}
.modal input{width:100%;padding:8px 10px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:13px;background:#fff;color:#3a3028;margin-bottom:10px;outline:none}
.modal input:focus{border-color:#c8a87a}
.modal-row{display:flex;gap:7px}
.modal-row button{flex:1;padding:8px;border-radius:8px;font-size:12px;cursor:pointer;border:1px solid rgba(0,0,0,0.12);background:#f8f6f2;color:#3a3028}
.modal-row button:hover{background:#ede9e0}
.modal-row button.pri{background:#c8a87a;color:#fff;border-color:#c8a87a}
.modal-row button.pri:hover{background:#b8986a}
</style>
</head>
<body>

<div class="frame">
  <div class="gem-bar">
    <span>💎</span>
    <b id="gems">120</b>
    <small>보석</small>
  </div>
  <div class="card" id="main-card"></div>
  <div class="list-wrap">
    <div class="list-lbl">수집된 주민</div>
    <div class="cat-grid" id="cat-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>이름 변경</h3>
    <input id="name-input" type="text" maxlength="12" placeholder="새 이름 입력">
    <div class="modal-row">
      <button onclick="closeModal()">취소</button>
      <button class="pri" onclick="saveName()">저장</button>
    </div>
  </div>
</div>

<script>
var gems = 120;
var sel = 0;
var editIdx = -1;

var EMOJIS   = ['🐱','😺','😸','😹','😻','🙀','😿','🐈','🐈','🦁'];
var COSTUMES = [null,'👒','🎩','🎀',null,'👑','🕶️',null,'🌸',null];
var NAMES    = ['하루','나비','루나','코코','모모','별이','구름','솔이','복숭아','미미'];
var AGES     = [1, 3, 0, 7, 12, 2, 5, 9, 14, 6];

var cats = [];
for (var i = 0; i < 10; i++) {
  cats.push({
    id: i + 1,
    name: NAMES[i],
    emoji: EMOJIS[i],
    costume: COSTUMES[i],
    happy: Math.floor(Math.random() * 60) + 40,
    sick: Math.random() < 0.3,
    bored: Math.random() < 0.35,
    age: AGES[i],
    isNew: i === 4
  });
}

function ageLabel(a) {
  return a === 0 ? '1살 미만' : a + '살';
}

function happyFace(p) {
  if (p >= 80) return '😄';
  if (p >= 50) return '🙂';
  if (p >= 30) return '😐';
  return '😟';
}

function alertOf(cat) {
  if (cat.isNew) return '🔴';
  if (cat.sick) return '🤒';
  if (cat.bored) return '🥱';
  return '';
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(function() { t.classList.remove('on'); }, 2000);
}

function renderCard() {
  var cat = cats[sel];
  var hp = Math.min(100, cat.happy);

  var healthHTML = cat.sick
    ? '<button class="abtn red" onclick="heal()">💉 치료하기<br>(💎10)</button>'
    : '<div class="abtn" style="cursor:default"><span class="badge ok">💚 건강<br>해요</span></div>';

  var playHTML = cat.bored
    ? '<button class="abtn" onclick="showToast(\'놀아주기로 이동했습니다\')">🎾 놀아<br>주기</button>'
    : '<div class="abtn" style="cursor:default"><span class="badge ok">😊 충분히<br>놀았어요</span></div>';

  document.getElementById('main-card').innerHTML =
    '<div class="card-row">' +
      '<div>' +
        '<div class="portrait">' +
          cat.emoji +
          (cat.costume ? '<span class="costume-tag">' + cat.costume + '</span>' : '') +
        '</div>' +
        '<div class="nav-btns">' +
          '<button class="icon-btn" onclick="showToast(\'도감으로 이동했습니다\')" title="이야기">📖</button>' +
          '<button class="icon-btn" onclick="showToast(\'코스튬으로 이동했습니다\')" title="코스튬">👕</button>' +
        '</div>' +
      '</div>' +
      '<div class="info">' +
        '<div class="name-row">' +
          '<span class="cat-name">' + cat.name + '</span>' +
          '<button class="icon-btn" onclick="openModal(' + sel + ')" title="이름변경">✏️</button>' +
        '</div>' +
        '<div class="happy-row">' +
          '<span>' + happyFace(hp) + '</span>' +
          '<span>' + hp + '%</span>' +
        '</div>' +
        '<div class="stats2">' +
          '<div class="stat-box"><div class="lbl">고양이번호</div><div class="val">#' + cat.id + '</div></div>' +
          '<div class="stat-box"><div class="lbl">나이</div><div class="val">' + ageLabel(cat.age) + '</div></div>' +
        '</div>' +
        '<div class="action-row">' + healthHTML + playHTML + '</div>' +
      '</div>' +
    '</div>';
}

function renderGrid() {
  var html = '';
  for (var i = 0; i < cats.length; i++) {
    var cat = cats[i];
    var al = alertOf(cat);
    html +=
      '<div class="cell' + (i === sel ? ' active' : '') + '" onclick="selectCat(' + i + ')" title="' + cat.name + '">' +
        cat.emoji +
        (cat.costume ? '<span class="cos">' + cat.costume + '</span>' : '') +
        (al ? '<span class="badge-dot">' + al + '</span>' : '') +
      '</div>';
  }
  document.getElementById('cat-grid').innerHTML = html;
}

function selectCat(i) {
  cats[i].isNew = false;
  sel = i;
  renderCard();
  renderGrid();
}

function heal() {
  if (gems < 10) { showToast('보석이 부족합니다'); return; }
  gems -= 10;
  cats[sel].sick = false;
  document.getElementById('gems').textContent = gems;
  showToast('치료 완료! 보석 10개 사용');
  renderCard();
  renderGrid();
}

function openModal(i) {
  editIdx = i;
  document.getElementById('name-input').value = cats[i].name;
  document.getElementById('overlay').classList.add('on');
  setTimeout(function() { document.getElementById('name-input').focus(); }, 50);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('on');
}

function saveName() {
  var v = document.getElementById('name-input').value.trim();
  if (!v) return;
  cats[editIdx].name = v;
  closeModal();
  renderCard();
  renderGrid();
}

document.getElementById('name-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') saveName();
  if (e.key === 'Escape') closeModal();
});

renderCard();
renderGrid();
</script>
</body>
</html>
